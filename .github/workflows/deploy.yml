name: Deploy

# main → dev automatically; prod on manual dispatch (protect the "prod"
# GitHub environment with required reviewers).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write # OIDC → AWS; no long-lived AWS keys in GitHub

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # The pipeline stops here if lint, typecheck, tests or the build fail.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ vars.APP_URL }}
    # Non-secret configuration lives in GitHub environment variables, taken
    # from `terraform output`. Nothing account-specific is in the repository.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      APP_URL: ${{ vars.APP_URL }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Render task definition with the new image
        id: render
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json
          echo "path=task-definition.json" >> "$GITHUB_OUTPUT"

      - name: Set image
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.path }}
          container-name: api
          image: ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}

      # Rolling deployment; the ECS circuit breaker rolls back automatically
      # if new tasks fail health checks, and this step then fails the job.
      - name: Deploy API to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # The API ships first so the new frontend never calls an endpoint that
      # doesn't exist yet.
      - name: Build web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build -w @vrp/web

      - name: Upload web to S3
        run: |
          # Hashed assets are immutable; HTML must always be revalidated.
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete \
            --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp apps/web/dist/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/"

      - name: Health check
        run: ./scripts/health-check.sh "$APP_URL"
